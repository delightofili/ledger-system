version: "3.9"

services:
  # Redis — idempotency keys and rate limiting
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    # appendonly yes = persist data to disk
    # so Redis survives container restarts

  # Zookeeper — required by Kafka for cluster coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Kafka — event streaming
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # replication factor 1 = single broker, fine for local dev
      # production would be 3+ for fault tolerance
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # auto-create topics on first publish
      # in production you'd pre-create with specific configs

volumes:
  redis_data:
